run_name: tinyllama_pubmed_domain_scratch
model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
train_file: ${HEART_WORK_DIR}/data/processed/pubmed_domain_train.jsonl
eval_file: ${HEART_WORK_DIR}/data/processed/pubmed_domain_eval.jsonl
output_dir: ${HEART_WORK_DIR}/runs/tinyllama_pubmed_lora/checkpoints
dataset_text_field: text
model_dtype: float16
training:
  max_seq_length: 1024
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_ratio: 0.03
  logging_steps: 20
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  fp16: true
  bf16: false
  gradient_checkpointing: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true
